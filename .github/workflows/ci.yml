name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      BASE_URL: ${{ vars.DFY_E2E_BASE_URL || 'https://dfy-fe-staging.onrender.com' }}
      DFY_API_URL: ${{ vars.DFY_API_URL || 'https://dfy-be-staging.onrender.com/api/v1' }}
      DFY_CREATOR_EMAIL: ${{ secrets.DFY_CREATOR_EMAIL }}
      DFY_CREATOR_PASSWORD: ${{ secrets.DFY_CREATOR_PASSWORD }}
      DFY_RUNNER_EMAIL: ${{ secrets.DFY_RUNNER_EMAIL }}
      DFY_RUNNER_PASSWORD: ${{ secrets.DFY_RUNNER_PASSWORD }}
      DFY_ADMIN_EMAIL: ${{ secrets.DFY_ADMIN_EMAIL }}
      DFY_ADMIN_PASSWORD: ${{ secrets.DFY_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        uses: microsoft/playwright-github-action@v1

      - name: Run staging E2E
        run: npm test -- e2e/staging.spec.ts e2e/creator-runner-24h-confirmation.spec.ts e2e/full-dfy-staging.spec.ts e2e/runner-creator-lifecycle.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  mobile-e2e:
    runs-on: ubuntu-latest
    needs: e2e
    env:
      BASE_URL: http://127.0.0.1:4173
      DFY_API_URL: ${{ vars.DFY_API_URL || 'https://dfy-be-staging.onrender.com/api/v1' }}
      DFY_CREATOR_EMAIL: ${{ secrets.DFY_CREATOR_EMAIL }}
      DFY_CREATOR_PASSWORD: ${{ secrets.DFY_CREATOR_PASSWORD }}
      DFY_ADMIN_EMAIL: ${{ secrets.DFY_ADMIN_EMAIL }}
      DFY_ADMIN_PASSWORD: ${{ secrets.DFY_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: https://dfy-be-staging.onrender.com/api/v1
          VITE_SIGNALR_URL: https://dfy-be-staging.onrender.com/taskHub
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dfy-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dfy-preview.log
          exit 1

      - name: Run mobile and marketing quality suite
        run: npm test -- e2e/mobile-responsive.spec.ts e2e/marketing-quality.spec.ts
